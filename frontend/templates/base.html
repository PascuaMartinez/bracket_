<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bracket{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado-interior">
      <a class="marca" href="{{ url_for('inicio.index') }}">Bracket</a>
      <nav class="navegacion">
        <a href="{{ url_for('inicio.index') }}">Inicio</a>
        <a href="{{ url_for('torneo.listado') }}">Torneos</a>
        <a href="{{ url_for('torneo.historial') }}">Historial</a>
        <a href="{{ url_for('jugador.listado') }}">Jugadores</a>
        <a href="{{ url_for('peleador.listado') }}">Personajes</a>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
