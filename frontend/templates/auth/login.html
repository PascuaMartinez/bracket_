{% extends "base.html" %}
{% block title %}Entrar · Bracket{% endblock %}

{% block content %}
<h1 class="titulo-pagina">Entrar</h1>
<p class="subtitulo">Hace falta para crear o modificar. Ver es libre.</p>

{% if error %}<div class="aviso-error">{{ error }}</div>{% endif %}

<form method="post" class="panel formulario" action="{{ url_for('auth.login', siguiente=siguiente) }}">
  <div class="campo">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" required autofocus>
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>
    <label class="opcion ver-password">
      <input type="checkbox" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">
      Mostrar contraseña
    </label>
  </div>

  <button type="submit" class="boton">Entrar</button>
</form>
{% endblock %}
